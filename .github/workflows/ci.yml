name: CI

on:
  push:
    branches:
      - 12.4-ults
  pull_request:
    branches:
      - 12.4-ults
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  static:
    name: CGL, PHPStan, integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Composer install
        run: Build/Scripts/runTests.sh -b docker -p 8.1 -s composer -- install --no-progress
      - name: CGL
        run: Build/Scripts/runTests.sh -b docker -p 8.1 -s cgl -n
      - name: PHPStan
        run: Build/Scripts/runTests.sh -b docker -p 8.1 -s phpstan
      - name: Exception codes
        run: Build/Scripts/runTests.sh -b docker -s checkExceptionCodes

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Composer install
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s composer -- install --no-progress
      - name: Unit tests
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s unit

  functional:
    name: Functional tests (SQLite, chunk ${{ matrix.chunk }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Composer install
        run: Build/Scripts/runTests.sh -b docker -p 8.1 -s composer -- install --no-progress
      - name: Functional tests
        run: Build/Scripts/runTests.sh -b docker -p 8.1 -s functional -d sqlite -c ${{ matrix.chunk }}/4
