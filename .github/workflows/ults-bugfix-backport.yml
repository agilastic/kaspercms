name: ULTS bug fix backport

# Cherry-picks upstream [BUGFIX] commits that apply cleanly to 12.4-ults,
# runs the CI checks on the result and opens one pull request per commit
# (a draft when a check failed). Merging stays a manual decision.
#
# The checks execute the cherry-picked code, Composer plugins and tests, so
# they run in jobs without write permissions (PHP 8.1, 8.3 and 8.5 in
# parallel). A separate job pushes the branch and opens the pull request
# from a fresh checkout.
#
# Pull requests opened with the GITHUB_TOKEN need a manual approval before the
# CI workflow runs on them, so the checks run here and their results are part
# of the pull request.

on:
  schedule:
    # every day, 04:00 UTC (06:00 CEST, 05:00 CET)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      commits:
        description: 'Upstream commit hashes to backport (space separated); empty = all clean candidates'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ults-bugfix-backport
  cancel-in-progress: false

env:
  CI: 'true'
  # Upper limit of pull requests opened per run
  MAX_CANDIDATES: 5

jobs:
  candidates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commits: ${{ steps.select.outputs.commits }}
    steps:
      - name: Checkout 12.4-ults
        uses: actions/checkout@v4
        with:
          ref: 12.4-ults
          fetch-depth: 0
          persist-credentials: false

      - name: Add TYPO3 upstream remote
        run: git remote add upstream https://github.com/TYPO3/typo3.git

      - name: Select candidates
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          # gh would otherwise resolve the "upstream" remote (TYPO3/typo3)
          GH_REPO: ${{ github.repository }}
          INPUT_COMMITS: ${{ inputs.commits }}
        run: |
          set +e
          if [ -n "$INPUT_COMMITS" ]; then
            git fetch --quiet upstream 13.4
            candidates="$INPUT_COMMITS"
          else
            php Build/Scripts/ultsSecurityCheck.php --checks=bugfixes --fetch > report.md
            if [ $? -eq 2 ]; then
              cat report.md
              exit 1
            fi
            # rows of the bug fix table whose last column is "yes" (applies cleanly)
            candidates=$(grep -E '^\| [0-9a-f]{11} \|' report.md | grep -E '\| yes \|$' | awk -F'|' '{gsub(/ /, "", $2); print $2}')
          fi
          selected=()
          for commit in $candidates; do
            sha=$(git rev-parse --verify --quiet "$commit^{commit}")
            if [ -z "$sha" ]; then
              echo "::warning::Unknown upstream commit $commit"
              continue
            fi
            short=${sha:0:11}
            existing=$(gh pr list --state all --head "backport/$short" --json number --jq 'length')
            if [ "$existing" != "0" ]; then
              echo "backport/$short already has a pull request, skipped."
              continue
            fi
            selected+=("$short")
            if [ ${#selected[@]} -ge "$MAX_CANDIDATES" ]; then
              break
            fi
          done
          json=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs 'map(select(. != ""))')
          echo "Selected: $json"
          echo "commits=$json" >> "$GITHUB_OUTPUT"

  # Cherry-picks the commit and hands it over as a git bundle. No checks run
  # here, so the bundle is created before any code of the backport runs.
  pick:
    needs: candidates
    if: needs.candidates.outputs.commits != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.candidates.outputs.commits) }}
    steps:
      - name: Checkout 12.4-ults
        uses: actions/checkout@v4
        with:
          ref: 12.4-ults
          fetch-depth: 0
          persist-credentials: false

      - name: Cherry-pick upstream commit
        id: pick
        run: |
          git remote add upstream https://github.com/TYPO3/typo3.git
          git fetch --quiet upstream 13.4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sha=$(git rev-parse "${{ matrix.commit }}^{commit}")
          base=$(git rev-parse HEAD)
          git switch -c "backport/${{ matrix.commit }}"
          mkdir -p handover
          if git cherry-pick -x "$sha"; then
            echo "picked=1" >> "$GITHUB_OUTPUT"
            git bundle create handover/backport.bundle "$base..backport/${{ matrix.commit }}"
            echo "$base" > handover/base
            echo "$sha" > handover/upstream
          else
            git cherry-pick --abort
            echo "::warning::${{ matrix.commit }} does not apply cleanly, no pull request opened."
            echo "picked=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand over the commit
        if: steps.pick.outputs.picked == '1'
        uses: actions/upload-artifact@v4
        with:
          name: backport-${{ matrix.commit }}
          path: handover/
          retention-days: 3

  # Runs the CI checks on PHP 8.1, 8.3 and 8.5 without write permissions:
  # the cherry-picked code, Composer plugins and tests run here. CGL, PHPStan
  # and the exception code check run once (PHP 8.1).
  checks:
    needs: [candidates, pick]
    if: always() && needs.candidates.outputs.commits != '[]' && needs.candidates.outputs.commits != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        commit: ${{ fromJSON(needs.candidates.outputs.commits) }}
        php: ['8.1', '8.3', '8.5']
    steps:
      - name: Checkout 12.4-ults
        uses: actions/checkout@v4
        with:
          ref: 12.4-ults
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the handed over commit
        id: handover
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backport-${{ matrix.commit }}
          path: handover

      - name: Run CI checks
        if: steps.handover.outcome == 'success'
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          set +e
          branch="backport/${{ matrix.commit }}"
          git fetch --quiet handover/backport.bundle "+refs/heads/$branch:refs/heads/$branch"
          git switch --quiet "$branch"
          : > checks.md
          : > failures.md
          run_check() {
            local name="$1"; shift
            echo "::group::$name"
            Build/Scripts/runTests.sh -b docker "$@" > "check.log" 2>&1
            local status=$?
            cat check.log
            echo "::endgroup::"
            if [ $status -eq 0 ]; then
              echo "| $name | ✅ passed |" >> checks.md
            else
              echo "| $name | ❌ failed |" >> checks.md
              # Without terminal escape sequences and progress bars
              { echo; echo "<details><summary>$name output (last 60 lines)</summary>"; echo; echo '```'
                sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' check.log | tr '\r' '\n' | grep -vE '░|▓' | tail -n 60
                echo '```'; echo "</details>"; } >> failures.md
            fi
          }
          run_check "Composer install (PHP $PHP_VERSION)" -p "$PHP_VERSION" -s composer -- install --no-progress
          if [ "$PHP_VERSION" = "8.1" ]; then
            run_check "CGL" -p 8.1 -s cgl -n
            run_check "PHPStan" -p 8.1 -s phpstan
            run_check "Exception codes" -s checkExceptionCodes
          fi
          run_check "Unit tests (PHP $PHP_VERSION)" -p "$PHP_VERSION" -s unit
          run_check "Functional tests (PHP $PHP_VERSION, SQLite)" -p "$PHP_VERSION" -s functional -d sqlite
          mkdir -p results
          cp checks.md failures.md results/

      - name: Hand over the check results
        if: steps.handover.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.commit }}-php${{ matrix.php }}
          path: results/
          retention-days: 3

  # Pushes the branch and opens the pull request from a fresh checkout. No
  # code of the backport is executed here.
  pull-request:
    needs: [candidates, checks]
    if: always() && needs.candidates.outputs.commits != '[]' && needs.candidates.outputs.commits != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.candidates.outputs.commits) }}
    steps:
      - name: Checkout 12.4-ults
        uses: actions/checkout@v4
        with:
          ref: 12.4-ults
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the handed over commit
        id: handover
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backport-${{ matrix.commit }}
          path: handover

      - name: Fetch the check results
        if: steps.handover.outcome == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: checks-${{ matrix.commit }}-php*
          path: results

      - name: Open pull request
        if: steps.handover.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="backport/${{ matrix.commit }}"
          base=$(cat handover/base)
          sha=$(cat handover/upstream)
          git fetch --quiet handover/backport.bundle "+refs/heads/$branch:refs/heads/$branch"
          # Exactly one commit on top of a base that is part of 12.4-ults (the
          # branch may have moved on while the checks ran), carrying the
          # expected "cherry picked from" line.
          if ! git merge-base --is-ancestor "$base" HEAD || [ "$(git rev-parse "$branch^")" != "$base" ] \
            || ! git log -1 --format=%B "$branch" | grep -qxF "(cherry picked from commit $sha)"; then
            echo "::error::Handed over commit for ${{ matrix.commit }} is not the expected cherry-pick."
            exit 1
          fi
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$branch"
          ok=1
          checks=""
          failures=""
          for php in 8.1 8.3 8.5; do
            dir="results/checks-${{ matrix.commit }}-php$php"
            if [ -s "$dir/checks.md" ]; then
              checks+="$(cat "$dir/checks.md")"$'\n'
              [ -s "$dir/failures.md" ] && failures+="$(cat "$dir/failures.md")"$'\n'
              grep -q '❌' "$dir/checks.md" && ok=0
            else
              checks+="| Checks on PHP $php | ❌ no results (job failed or was cancelled) |"$'\n'
              ok=0
            fi
          done
          subject=$(git log -1 --format=%s "$branch")
          resolves=$(git log -1 --format='%(trailers:key=Resolves,valueonly,separator=%x2C )' "$branch")
          {
            echo "Automated backport of upstream \`${sha:0:11}\` from TYPO3 13.4 ([commit](https://github.com/TYPO3/typo3/commit/$sha))."
            for issue in $(echo "$resolves" | grep -oE '[0-9]+'); do
              echo "Forge: https://forge.typo3.org/issues/$issue"
            done
            echo
            echo "## Checks"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            printf '%s' "$checks"
            printf '%s' "$failures"
            echo
            echo "## Before merging"
            echo
            echo "- Review the change for v12 compatibility (APIs, behaviour, PHP 8.1)."
            echo "- Merge with **Rebase and merge** so the \`cherry picked from\` line stays."
            echo "- Not suitable: close this pull request and list \`${sha:0:11}\` with a reason in ULTS-PROCESS.md (\"Upstream bug fixes not backported\")."
          } > body.md
          gh label create ults-backport --color 1D76DB \
            --description "Automated backport of an upstream bug fix" 2>/dev/null || true
          draft=()
          if [ "$ok" != "1" ]; then
            draft=(--draft)
          fi
          gh pr create --base 12.4-ults --head "$branch" --title "$subject" \
            --label ults-backport --body-file body.md "${draft[@]}"
