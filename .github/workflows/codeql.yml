name: CodeQL

# Weekly CodeQL analysis of the workflow files (actions) and the backend
# TypeScript/JavaScript sources. PHP is not supported by CodeQL and is
# covered by the Semgrep workflow. Results are uploaded to code scanning.

on:
  schedule:
    # every Sunday, 05:00 UTC (after the Semgrep scan)
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['actions', 'javascript-typescript']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 12.4-ults
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths:
              - .github
              - Build/Sources
              - Build/Scripts
            paths-ignore:
              - Build/node_modules
              - '**/Contrib/**'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
