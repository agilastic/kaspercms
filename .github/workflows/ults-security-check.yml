name: ULTS security check

on:
  schedule:
    # every day, 04:00 UTC (06:00 CEST)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 12.4-ults
        uses: actions/checkout@v4
        with:
          ref: 12.4-ults
          fetch-depth: 0

      - name: Add TYPO3 upstream remote
        run: git remote add upstream https://github.com/TYPO3/typo3.git

      - name: Run security check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          php Build/Scripts/ultsSecurityCheck.php --fetch > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # Mails go out only when the report differs from the previous run.
      # The last report is kept in the Actions cache (a new entry per run).
      - name: Restore previous report
        if: steps.check.outputs.status != '2'
        uses: actions/cache/restore@v4
        with:
          path: previous-report
          key: ults-check-report-${{ github.run_id }}
          restore-keys: ults-check-report-

      - name: Compare with previous report
        id: compare
        if: steps.check.outputs.status == '1'
        run: |
          if [ -f previous-report/report.md ] \
            && diff -q <(grep -v '^Date: ' previous-report/report.md) <(grep -v '^Date: ' report.md) > /dev/null; then
            echo "Findings unchanged, no mail sent."
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      # Requires the repository secrets SMTP_SERVER, SMTP_PORT, SMTP_USERNAME,
      # SMTP_PASSWORD and ULTS_MAIL_TO. GitHub issues are not used: gh resolves
      # the "upstream" remote (TYPO3/typo3) before "origin".
      - name: Send report by mail
        if: steps.compare.outputs.changed == '1'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_PORT == '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: KasperCMS ULTS check <${{ secrets.SMTP_USERNAME }}>
          to: ${{ secrets.ULTS_MAIL_TO }}
          subject: "[KasperCMS] ULTS security check: open items"
          body: file://report.md
          convert_markdown: true

      - name: Store report for the next run
        if: steps.check.outputs.status != '2'
        run: |
          mkdir -p previous-report
          cp report.md previous-report/report.md

      - name: Save report
        if: steps.check.outputs.status != '2'
        uses: actions/cache/save@v4
        with:
          path: previous-report
          key: ults-check-report-${{ github.run_id }}

      - name: Fail if the check could not be completed
        if: steps.check.outputs.status == '2'
        run: exit 1
