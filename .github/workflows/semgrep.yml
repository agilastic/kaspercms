name: Semgrep

on:
  schedule:
    # every Sunday, 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 12.4-ults
      - name: Semgrep scan
        run: |
          semgrep scan --config p/php \
            --exclude vendor --exclude 'Build/node_modules' --exclude '*/Tests/*' \
            --sarif --output semgrep.sarif || true
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
